#ddev-generated
services:
  wiremock:
    container_name: ddev-${DDEV_SITENAME}-wiremock
    image: wiremock/wiremock:${WIREMOCK_TAG:-3x}
    hostname: wiremock
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    expose:
      - "8080"
    environment:
      - HTTP_EXPOSE=8080:8080
      - HTTPS_EXPOSE=8443:8080
    volumes:
      - ".:/mnt/ddev_config"
      - "./wiremock:/home/wiremock"
    command:
      - "--global-response-templating"
      - "--disable-banner"
      - "--verbose"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s
    x-ddev:
      describe-url-port: |
        WireMock admin: https://${DDEV_HOSTNAME}:8443/__admin
      describe-info: |
        Stubs:   .ddev/wiremock/mappings/
        Files:   .ddev/wiremock/__files/
        Config:  .ddev/.env.wiremock
