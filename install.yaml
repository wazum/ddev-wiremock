name: wiremock

ddev_version_constraint: '>= v1.24.10'

project_files:
  - docker-compose.wiremock.yaml
  - config.wiremock.yaml
  - wiremock/mappings/sample.json
  - wiremock/mappings/.gitkeep
  - wiremock/__files/.gitkeep
  - wiremock/README.md
  - commands/host/wiremock-add
  - commands/host/wiremock-logs
  - commands/host/wiremock-mappings
  - commands/host/wiremock-record
  - commands/host/wiremock-record-stop
  - commands/host/wiremock-reload
  - commands/host/wiremock-requests
  - commands/host/wiremock-reset
  - commands/host/wiremock-snapshot

post_install_actions:
  - |
    #ddev-description:Seed .ddev/.env.wiremock with defaults if not present
    env_file="$DDEV_APPROOT/.ddev/.env.wiremock"
    if [ ! -f "$env_file" ]; then
      ddev dotenv set .ddev/.env.wiremock \
        --wiremock-tag=3x \
        --wiremock-http-port=8080 \
        --wiremock-https-port=8443
      printf '#ddev-generated\n%s' "$(cat "$env_file")" > "$env_file"
    fi
  - |
    #ddev-description:Print usage hint
    https_port=$(grep '^WIREMOCK_HTTPS_PORT=' "$DDEV_APPROOT/.ddev/.env.wiremock" 2>/dev/null | cut -d= -f2 | tr -d '"' || echo 8443)
    echo "WireMock available at https://${DDEV_HOSTNAME}:${https_port:-8443} after 'ddev restart'."
    echo "Stub authoring: see .ddev/wiremock/README.md."

removal_actions:
  - |
    #ddev-description:Remove .env.wiremock only if untouched
    file="${DDEV_APPROOT}/.ddev/.env.wiremock"
    if [ -f "$file" ] && grep -q '#ddev-generated' "$file"; then
      rm -f "$file"
    fi
  - |
    #ddev-description:Preserve user-authored stubs by default
    echo ".ddev/wiremock/ retained - delete manually if no longer needed."
